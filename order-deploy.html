ngler deploy</span><span class="order-moves"><button class="order-mv" type="button" data-mv="up" data-pos="3" aria-label="move up"><span class="material-symbols-rounded">arrow_upward</span></button><button class="order-mv" type="button" data-mv="down" data-pos="3" aria-label="move down"><span class="material-symbols-rounded">arrow_downward</span></button></span></li><li class="order-step"><span class="order-num">5</span><span class="order-text">本機測試：wrangler dev</span><span class="order-moves"><button class="order-mv" type="button" data-mv="up" data-pos="4" aria-label="move up"><span class="material-symbols-rounded">arrow_upward</span></button><button class="order-mv" type="button" data-mv="down" data-pos="4" aria-label="move down"><span class="material-symbols-rounded">arrow_downward</span></button></span></li><li class="order-step"><span class="order-num">6</span><span class="order-text">登入：wrangler login</span><span class="order-moves"><button class="order-mv" type="button" data-mv="up" data-pos="5" aria-label="move up"><span class="material-symbols-rounded">arrow_upward</span></button><button class="order-mv" type="button" data-mv="down" data-pos="5" disabled="" aria-label="move down"><span class="material-symbols-rounded">arrow_downward</span></button></span></li></ol><div class="order-foot"><button class="game-btn" type="button" data-check=""><span class="material-symbols-rounded">fact_check</span>檢查順序</button></div></div>
