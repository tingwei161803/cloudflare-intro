<div class="lhero"><span class="lhero__badge"><span class="material-symbols-rounded">sell</span>Practice</span><div class="lhero__top"><span class="lhero__icon"><span class="material-symbols-rounded">style</span></span><h1 class="lhero__title">Flashcards</h1></div><p class="lhero__tagline">Tap a card to flip it: product or term on the front, a plain-language reminder on the back.</p></div><p class="fc-tip"><span class="material-symbols-rounded">touch_app</span>Tap a card to flip it.</p><div class="fc-grid"><button class="fc reveal is-in" data-item="" type="button" data-fc="0" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Run serverless code at the edge — your function runs in 330+ cities close to users, with near-zero cold starts and no servers to manage.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="1" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Containers</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Run full Docker containers on Cloudflare's network when Workers isn't enough — for custom runtimes, large dependencies or longer jobs. Each container is orchestrated by a Durable Object.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="2" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Durable Objects</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Stateful serverless objects — each one is a single, addressable instance with its own storage. Perfect for coordination and strong consistency (chat rooms, multiplayer, real-time collaboration).</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="3" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Queues</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">A message queue for Workers. Producers drop messages in; consumers process them later with automatic retries and batching — so slow work doesn't block your app.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="4" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers AI</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Run AI models (LLMs, image generation, speech-to-text) on Cloudflare's GPU network with a simple API. Pay only for what you use, no GPUs to manage.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="5" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">AI Gateway</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">A control layer in front of any AI provider (OpenAI, Anthropic, Workers AI…). Adds caching, rate limiting, retries, logging and cost analytics to your AI calls.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="6" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Agents</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">A framework for building AI agents on Workers — stateful, persistent, able to call tools and run on a schedule. Built on Durable Objects so each agent remembers its state.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="7" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Vectorize</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">A vector database for storing embeddings and doing similarity search. It's the memory behind semantic search and RAG (retrieval-augmented generation).</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="8" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Browser Rendering</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Control a headless Chrome browser from a Worker (via Puppeteer/Playwright). Take screenshots, generate PDFs, scrape pages, or render JavaScript-heavy sites.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="9" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">R2</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Object storage for big files (images, videos, backups), S3-compatible — with zero egress fees, so you don't pay to read your data back out.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="10" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">D1</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Cloudflare's serverless SQL database, built on SQLite. Use real relational SQL queries (tables, joins, indexes) right from your Workers.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="11" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers KV</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">A globally distributed key-value store. Eventually consistent and optimized for very fast reads of small values (config, sessions, feature flags).</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="12" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Hyperdrive</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Makes your existing regional Postgres/MySQL database feel fast and global from Workers, by pooling connections and caching queries at the edge.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="13" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Pipelines</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Ingest large streams of events/data and load them reliably into R2 — a managed pipeline for high-volume data ingestion without running your own infrastructure.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="14" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Images</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Store, resize, optimize and deliver images from one product. Upload once, then serve many variants (sizes/formats) without running your own image server.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="15" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Stream</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Upload, store, encode and deliver video — both on-demand and live — with a built-in player and adaptive bitrate. Like a self-hosted YouTube backend.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="16" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Realtime</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Build real-time audio, video and data apps (WebRTC) — Cloudflare runs the SFU that relays media between participants. Formerly Cloudflare Calls.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="17" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">WAF</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Web Application Firewall — rules that inspect incoming traffic and block attacks (SQL injection, XSS, malicious bots) before they reach your site.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="18" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">SSL/TLS</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Free SSL/TLS certificates and HTTPS encryption for your domain, so traffic between visitors and your site is encrypted — that's the padlock in the browser.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="19" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Turnstile</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">A privacy-friendly CAPTCHA replacement that proves a visitor is human — usually with no puzzle to solve. Stops bots from abusing your forms and signups.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="20" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Cloudflare Tunnel</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Connect a server or app to Cloudflare through an outbound-only tunnel (cloudflared) — no public IP and no open inbound ports, so your origin stays hidden.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="21" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Access</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Zero Trust access control — put an identity login in front of your internal apps instead of a VPN. Only verified users get in.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="22" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Gateway</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">A Secure Web Gateway that filters your users' outbound DNS and web traffic — blocking malware, phishing and unwanted sites before devices ever connect.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="23" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">DNS</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Fast, authoritative DNS that translates domain names (example.com) into IP addresses. Cloudflare runs one of the world's largest, with DNSSEC support.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="24" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">CDN</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Content Delivery Network — caches copies of your site in 330+ cities, so each visitor is served from a nearby location and pages load faster.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="25" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Speed</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Cloudflare's performance toolkit — measure your site with Observatory, then speed it up with optimizations like Argo Smart Routing, caching tweaks and image tuning.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="26" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Smart Shield</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Cloudflare's always-on, automatic protections that need no setup — smart DDoS mitigation, bot defenses and routing that keep your site secure and fast out of the box.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="27" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Web Analytics</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Privacy-first website analytics — no cookies, no cross-site tracking, and it won't slow your page. See visits and Core Web Vitals for free.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="28" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">R2 vs KV vs D1?</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">R2 = big files (object storage, no egress fees). KV = small, fast key-value reads. D1 = relational SQL queries with tables and joins.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="29" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">WAF vs Turnstile?</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">WAF filters malicious traffic at the network level (attacks, bad bots) for your whole site. Turnstile is a human check you place on a specific form or login.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="30" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Tunnel vs Access?</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Tunnel is the secure pipe that connects your private server to Cloudflare (no open ports). Access is the login/policy that decides who's allowed through. They're often used together.</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="31" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers vs Containers?</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>Flip</span></div><div class="fc__face fc__back"><span class="fc__def">Workers = lightweight functions, instant scale, near-zero cold starts — great for most web logic. Containers = full Docker images for custom runtimes, big dependencies or longer-running jobs.</span></div></div></button></div>
