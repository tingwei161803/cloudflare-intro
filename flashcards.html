<div class="lhero"><span class="lhero__badge"><span class="material-symbols-rounded">sell</span>練習</span><div class="lhero__top"><span class="lhero__icon"><span class="material-symbols-rounded">style</span></span><h1 class="lhero__title">字卡</h1></div><p class="lhero__tagline">點一下卡片翻面：正面是產品或術語，背面是一句白話的重點提醒。</p></div><p class="fc-tip"><span class="material-symbols-rounded">touch_app</span>點一下卡片就會翻面。</p><div class="fc-grid"><button class="fc reveal is-in" data-item="" type="button" data-fc="0" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">在邊緣執行無伺服器（serverless）程式碼——你的函式會在離使用者最近的 330+ 個城市執行，幾乎沒有冷啟動，也不用管理伺服器。</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="1" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Containers</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">當 Workers 不夠用時，在 Cloudflare 網路上跑完整的 Docker 容器——適合自訂執行環境、龐大相依套件或較長時間的工作。每個容器由 Durable Object 協調管理。</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="2" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Durable Objects</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">有狀態的無伺服器物件——每一個都是單一、可定址的實例，擁有自己的儲存空間。最適合做協調與強一致性的場景（聊天室、多人遊戲、即時協作）。</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="3" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Queues</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">給 Workers 用的訊息佇列（queue）。生產者把訊息丟進去，消費者稍後再處理，並自動重試與批次處理——讓耗時的工作不會卡住你的應用程式。</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="4" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers AI</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">用簡單的 API 在 Cloudflare 的 GPU 網路上執行 AI 模型（大型語言模型、圖片生成、語音轉文字）。用多少付多少，不用自己管理 GPU。</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="5" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">AI Gateway</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">架在任何 AI 供應商（OpenAI、Anthropic、Workers AI…）前面的控管層。為你的 AI 請求加上快取、流量限制、重試、紀錄與花費分析。</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="6" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Agents</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">在 Workers 上打造 AI 代理（agent）的框架——有狀態、可持久保存、能呼叫工具並排程執行。建構於 Durable Objects 之上，讓每個代理都能記住自己的狀態。</span></div></div></button><button class="fc reveal is-in" data-item="" type="button" data-fc="7" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Vectorize</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">用來存放嵌入向量（embeddings）並做相似度搜尋的向量資料庫。它是語意搜尋與 RAG（檢索增強生成）背後的「記憶體」。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="8" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Browser Rendering</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">從 Worker 操控一個無頭（headless）Chrome 瀏覽器（透過 Puppeteer／Playwright）。可以截圖、產生 PDF、爬取網頁，或渲染大量使用 JavaScript 的網站。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="9" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">R2</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">存放大型檔案（圖片、影片、備份）的物件儲存，相容 S3 API——而且免流出（egress）費用，把資料讀出來不用另外付錢。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="10" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">D1</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">Cloudflare 的無伺服器 SQL 資料庫，建構於 SQLite 之上。可以直接在 Workers 裡用真正的關聯式 SQL 查詢（資料表、JOIN、索引）。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="11" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers KV</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">全球分散式的鍵值（key-value）儲存。採最終一致性，專為小資料的超快讀取最佳化（設定、工作階段、功能旗標）。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="12" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Hyperdrive</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">透過連線池（connection pool）與在邊緣快取查詢，讓你「現有的」區域型 Postgres／MySQL 資料庫從 Workers 連過去又快又像全球部署。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="13" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Pipelines</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">大量接收串流事件／資料，並可靠地寫入 R2——一個託管式的資料匯入管線（pipeline），不用自己架設基礎設施就能處理高流量資料。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="14" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Images</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">一個產品就能儲存、縮放、最佳化並傳遞圖片。上傳一次，就能提供多種變體（尺寸／格式），不必自己架圖片伺服器。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="15" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Stream</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">上傳、儲存、編碼並傳遞影片——支援隨選（on-demand）與直播——內建播放器與自動調整畫質。就像自己的 YouTube 後端。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="16" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Realtime</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">打造即時音訊、視訊與資料應用（WebRTC）——由 Cloudflare 提供 SFU 伺服器，在參與者之間轉送媒體串流。前身為 Cloudflare Calls。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="17" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">WAF</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">Web 應用程式防火牆——用規則檢查進來的流量，在攻擊（SQL 注入、XSS、惡意機器人）抵達你的網站「之前」就擋下來。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="18" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">SSL/TLS</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">為你的網域提供免費的 SSL／TLS 憑證與 HTTPS 加密，讓訪客與你網站之間的流量都加密——也就是瀏覽器網址列上的那個鎖頭。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="19" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Turnstile</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">注重隱私的 CAPTCHA 替代方案，用來證明訪客是真人——通常不用解任何拼圖。能擋掉機器人濫用你的表單與註冊。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="20" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Cloudflare Tunnel</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">透過只對外連線的通道（cloudflared）把伺服器或應用程式接到 Cloudflare——不需要公開 IP，也不用開放對內連接埠，來源伺服器因此被隱藏起來。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="21" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Access</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">Zero Trust（零信任）存取控制——在內部應用程式前面擺一道身分登入，取代傳統 VPN。只有通過驗證的使用者才進得來。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="22" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Gateway</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">安全 Web 閘道，過濾你使用者「對外」的 DNS 與網頁流量——在裝置連上去之前，就擋掉惡意程式、釣魚與不該造訪的網站。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="23" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">DNS</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">又快又可靠的權威 DNS，把網域名稱（example.com）轉換成 IP 位址。Cloudflare 營運全球最大的 DNS 之一，並支援 DNSSEC。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="24" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">CDN</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">內容傳遞網路（CDN）——在 330+ 個城市快取你網站的副本，讓每位訪客都從就近的據點取得內容，網頁載入更快。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="25" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Speed</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">Cloudflare 的效能工具組——用 Observatory 量測你的網站，再透過 Argo 智慧路由、快取調整與圖片最佳化等手段加速。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="26" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Smart Shield</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">Cloudflare 免設定、隨時運作的自動防護——智慧 DDoS 緩解、機器人防禦與路由最佳化，開箱即用地讓你的網站又安全又快速。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="27" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Web Analytics</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">注重隱私的網站分析——不用 cookie、不跨站追蹤，也不會拖慢你的網頁。免費查看流量與 Core Web Vitals（核心網頁指標）。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="28" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">R2、KV、D1 差在哪？</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">R2＝大檔案（物件儲存、免流出費）。KV＝又快又小的鍵值讀取。D1＝有資料表與 JOIN 的關聯式 SQL 查詢。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="29" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">WAF 和 Turnstile 怎麼選？</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">WAF 在網路層為整個網站過濾惡意流量（攻擊、壞機器人）。Turnstile 則是你放在特定表單或登入頁的「真人驗證」。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="30" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Tunnel 和 Access 差在哪？</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">Tunnel 是把你私有伺服器接到 Cloudflare 的安全通道（不用開連接埠）。Access 則是決定「誰能通過」的登入與政策。兩者常常搭配使用。</span></div></div></button><button class="fc reveal" data-item="" type="button" data-fc="31" aria-pressed="false"><div class="fc__inner"><div class="fc__face fc__front"><span class="fc__term">Workers 和 Containers 怎麼選？</span><span class="fc__hint"><span class="material-symbols-rounded">touch_app</span>翻面</span></div><div class="fc__face fc__back"><span class="fc__def">Workers＝輕量函式、瞬間擴展、幾乎零冷啟動——適合大多數網站邏輯。Containers＝完整的 Docker 映像檔，適合自訂執行環境、龐大相依套件或較長時間的工作。</span></div></div></button></div>
